version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code-drive-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
